[project]
name = "yus"
version = "0.1"
description = "Derive statistics for Ultimate games based on informal play-by-play commentary."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Gavin Kistner", email = "gavin@phrogz.net" }]

dependencies = [
    "ruff>=0.9.3",
    "pydantic>=2.10.6",
    "flask>=3.0.3",
    "dash>=2.18.2",
    "pytest>=8.3.4",
    "google-cloud-speech>=2.30.0",
    "faster-whisper>=1.1.0",
    "pandas>=2.2.3",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "a2wsgi>=1.10",
    "websockets>=13",
]

[project.optional-dependencies]
# Apple Silicon GPU backend for yus-transcribe; mlx only ships wheels for macOS 14+ on arm64.
mlx = ["mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
yus-transcribe = "yus.processing.transcription.transcribe:main"
yus-live-transcribe = "yus.processing.transcription.live:main"
yus-events = "yus.processing.event_extraction.cli:main"
yus-score = "yus.processing.evaluation:main"
yus-stats = "yus.processing.stats.cli:main"
yus-serve = "yus.web.server:main"
yus-replay = "yus.web.replay:main"
yus-game = "yus.game_cli:main"

[tool.uv]
package = true

[tool.setuptools.package-data]
"yus.web" = ["static/*"]  # the server's pages and scripts, also in a non-editable install

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
